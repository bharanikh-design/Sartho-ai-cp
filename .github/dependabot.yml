# Dependabot keeps the pinned action SHAs and the npm lockfile current.
#
# The workflows pin every action to a commit SHA rather than a moving tag, so
# a compromised tag cannot change what runs in CI; this is what moves the pins
# forward when a new release is worth taking. Version updates are configured
# here. Dependabot *alerts* and security updates are repository settings
# (Settings → Code security and analysis), not a file, and have to be switched
# on there.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # One PR for the routine bumps, so the lockfile churn is reviewed once a
    # week rather than once per package. Majors still arrive on their own.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
