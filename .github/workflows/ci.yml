name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Typecheck, Lint, and Test
    runs-on: ubuntu-latest

    # Supplied so `next build` can construct its clients. Placeholders, not
    # secrets: the build renders pages, it never reaches this project.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Read from .nvmrc rather than pinned here, because it had drifted: the
      # repo declares Node 24 in .nvmrc and in package.json engines, which is
      # what Vercel builds with, while CI quietly tested on 20. Every run also
      # carried a supabase-js warning that Node 20 support is ending.
      #
      # A gate running a different runtime from production is a gate that can
      # pass on code that cannot deploy — and, as here, fail on code that works
      # everywhere else. One file names the version now, so it cannot drift again.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Lint
        run: npm run lint
        
      - name: Run unit tests
        run: npm run test

      # The gate the other three cannot be: `export const metadata` in a file
      # carrying "use client" typechecks, lints and tests clean, and fails the
      # production build outright. That exact mistake shipped from main once and
      # broke every deploy until it was found by hand.
      - name: Build
        run: npm run build
