name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# A new push makes every older run obsolete. Cancel it instead of paying to
# finish checks for code that can no longer be merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # Fast deterministic gates first. If either fails, do not spend minutes
      # running the full suite/build on code that cannot merge.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The full suite remains the merge gate, but runs once—not again in the
      # automated review workflow.
      - name: Unit tests
        run: npm run test

      # Build already executes prebuild, which creates and verifies the browser
      # extension. Running extension:zip + extension:verify separately duplicated
      # that work on every PR.
      - name: Production build
        run: npm run build
