name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run has nothing to say about the commit that replaced it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The production build reads these at module scope, so it cannot compile
      # without them. They are deliberately not secrets: nothing in CI contacts
      # Supabase, and a real project URL here would only invite one to.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      # No provider key is set, so ordinary runs cannot reach an AI provider.
      # `npm run check:ai` is the only thing that does, and it is never run here.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: the lockfile is the reproducible-build guarantee,
      # and this fails loudly rather than quietly rewriting it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
